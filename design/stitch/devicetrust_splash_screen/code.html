<script>
  document.addEventListener('DOMContentLoaded', () => {
    const indicator = document.getElementById('syncIndicator');
    if (indicator) {
      indicator.parentElement.addEventListener('click', () => {
        const dots = indicator.querySelectorAll('span');
        dots.forEach(d => {
          d.classList.add('scale-125');
          setTimeout(() => d.classList.remove('scale-125'), 300);
        });
      });
    }

    // Auto-advance to onboarding after 3.2 seconds
    const advanceTimer = setTimeout(() => {
      window.location.href = '../devicetrust_onboarding/code.html';
    }, 3200);

    // Clicking anywhere proceeds immediately
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      clearTimeout(advanceTimer);
      window.location.href = '../devicetrust_onboarding/code.html';
    });
  });
