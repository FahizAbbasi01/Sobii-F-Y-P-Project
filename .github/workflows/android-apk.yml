name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app connects to"
        required: true
        default: "http://192.168.0.104:4000"
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://192.168.0.104:4000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Generate Android project (Android only)
        run: |
          flutter create --platforms=android --org com.devicetrust --project-name devicetrust .
          rm -f test/widget_test.dart
          # Flutter applies android/app/proguard-rules.pro to release builds automatically.
          cp proguard-rules.pro android/app/proguard-rules.pro
          GRADLE=android/app/build.gradle.kts
          [ -f "$GRADLE" ] || GRADLE=android/app/build.gradle
          sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/' "$GRADLE"
          grep -n "minSdk" "$GRADLE"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>#' "$M"
          # Demo build talks to a plain-HTTP backend; remove once the API is served over HTTPS.
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          sed -i -E 's/android:label="[^"]*"/android:label="DeviceTrust"/' "$M"
          cat "$M"

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build universal release APK (armeabi-v7a + arm64-v8a + x86_64)
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define=API_BASE_URL="$API_BASE_URL" 2>&1 | tee build.log

      - name: Inspect APK
        run: |
          set -o pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "lib/.*/libapp.so|lib/.*/libflutter.so" | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: DeviceTrust-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Logs/artifacts on blob storage are unreachable from the developer's network, so publish
      # the build log (and the APK when it exists) to a dedicated branch that plain git can fetch.
      - name: Publish APK and log to apk-output branch
        if: always()
        run: |
          OUT=$(mktemp -d)
          cp build.log "$OUT/build.log" 2>/dev/null || echo "no build log" > "$OUT/build.log"
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk "$OUT/DeviceTrust.apk"
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} api=${API_BASE_URL}" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b apk-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APK build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-output
