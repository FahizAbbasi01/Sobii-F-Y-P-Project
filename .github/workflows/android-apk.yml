name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml", ".github/scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Generate Android project (Android only)
        run: |
          flutter create --platforms=android --org com.devicetrust --project-name devicetrust .
          rm -f test/widget_test.dart
          # Flutter applies android/app/proguard-rules.pro to release builds automatically.
          cp proguard-rules.pro android/app/proguard-rules.pro
          GRADLE=android/app/build.gradle.kts
          [ -f "$GRADLE" ] || GRADLE=android/app/build.gradle
          sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/' "$GRADLE"
          grep -n "minSdk" "$GRADLE"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$M" || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.CAMERA"/>#' "$M"
          sed -i -E 's/android:label="[^"]*"/android:label="DeviceTrust"/' "$M"
          cat "$M"

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Unit + UI flow tests (demo mode)
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build universal release APK (demo mode, offline)
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define=DEMO_MODE=true 2>&1 | tee build.log
          ls -la build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "lib/.*/libapp.so|fonts/Inter" | tee -a build.log

      - name: Enable KVM for the emulator
        if: success()
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and run the APK on an Android emulator (airplane mode)
        id: smoke
        if: success()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile
          script: bash ../.github/scripts/emulator_smoke.sh build/app/outputs/flutter-apk/app-release.apk ${{ github.workspace }}/mobile/smoke

      # Logs/artifacts on blob storage are unreachable from the developer's network, so publish
      # the APK, logs and emulator screenshots to a dedicated branch that plain git can fetch.
      - name: Publish APK, logs and screenshots to apk-output branch
        if: always()
        run: |
          OUT=$(mktemp -d)
          for f in analyze.log test.log build.log; do cp "$f" "$OUT/" 2>/dev/null || true; done
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk "$OUT/DeviceTrust.apk"
          [ -d smoke ] && cp -r smoke "$OUT/smoke"
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} mode=demo smoke=${{ steps.smoke.outcome }}" > "$OUT/BUILD_INFO.txt"
          cd "$OUT"
          git init -q -b apk-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APK build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-output

      - name: Fail the job if the emulator check failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
