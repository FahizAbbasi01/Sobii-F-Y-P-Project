name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app connects to"
        required: true
        default: "http://192.168.0.104:4000"
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://192.168.0.104:4000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Generate Android project (Android only)
        run: |
          flutter create --platforms=android --org com.devicetrust --project-name devicetrust .
          rm -f test/widget_test.dart
          GRADLE=android/app/build.gradle.kts
          [ -f "$GRADLE" ] || GRADLE=android/app/build.gradle
          sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/' "$GRADLE"
          grep -n "minSdk" "$GRADLE"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>#' "$M"
          # Demo build talks to a plain-HTTP backend; remove once the API is served over HTTPS.
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          sed -i -E 's/android:label="[^"]*"/android:label="DeviceTrust"/' "$M"
          cat "$M"

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build universal release APK (armeabi-v7a + arm64-v8a + x86_64)
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Inspect APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "lib/.*/libapp.so|lib/.*/libflutter.so"

      - uses: actions/upload-artifact@v4
        with:
          name: DeviceTrust-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
